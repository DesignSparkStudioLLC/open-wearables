global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # FastAPI backend - request rate, latency, status codes (prometheus-fastapi-instrumentator)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  # Celery - Flower 2.x exposes Prometheus metrics natively (task runtime, events, workers)
  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

  # Redis - memory usage, maxmemory, and per-queue list lengths (via REDIS_EXPORTER_CHECK_KEYS)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
