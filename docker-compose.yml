services:
  db:
    image: postgres:18
    container_name: postgres__open-wearables
    environment:
      POSTGRES_DB: open-wearables
      POSTGRES_USER: open-wearables
      POSTGRES_PASSWORD: open-wearables
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-wearables -d open-wearables"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init/create-svix-db.sql:/docker-entrypoint-initdb.d/create-svix-db.sql:ro

  app:
    build:
        context: ./backend
        dockerfile: Dockerfile
    container_name: backend__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/app.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /root_project/app
        - action: sync+restart
          path: ./backend/migrations
          target: /root_project/migrations
        - action: sync+restart
          path: ./backend/config/.env
          target: /root_project/config/.env
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts
        - action: sync
          path: ./backend/tests
          target: /root_project/tests
        - action: rebuild
          path: ./backend/uv.lock
    restart: on-failure

  celery-worker:
    container_name: celery-worker__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/worker.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /root_project/app
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts

  celery-beat:
    container_name: celery-beat__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/beat.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /root_project/app
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts

  flower:
    container_name: flower__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/flower.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /root_project
          ignore:
            - .venv/

  redis:
    container_name: redis__open-wearables
    image: redis:8
    entrypoint:
      - sh
      - -c
      - |
        # Seed AOF from an existing RDB before enabling it, otherwise Redis boots
        # empty and ignores dump.rdb. Skipped once appendonlydir exists.
        if [ ! -d /data/appendonlydir ] && [ -f /data/dump.rdb ]; then
          redis-server --daemonize no &
          RPID=$$!
          until redis-cli ping >/dev/null 2>&1; do sleep 0.2; done
          redis-cli CONFIG SET appendonly yes
          sleep 1
          until redis-cli INFO persistence | grep -q 'aof_rewrite_in_progress:0'; do sleep 0.2; done
          redis-cli SHUTDOWN NOSAVE
          wait "$$RPID" 2>/dev/null
        fi
        exec redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  svix-server:
    container_name: svix-server__open-wearables
    image: svix/svix-server:v1
    entrypoint:
      - sh
      - -c
      - |
        : "$${SVIX_JWT_SECRET:=$$SECRET_KEY}"
        export SVIX_JWT_SECRET
        exec svix-server "$$@"
      - --
    command: ["--run-migrations"]
    env_file:
      - ./backend/config/.env
    environment:
      SVIX_DB_DSN: "postgresql://${DB_USER:-open-wearables}:${DB_PASSWORD:-open-wearables}@${DB_HOST:-db}:${DB_PORT:-5432}/svix"
      SVIX_QUEUE_TYPE: "redis"
      SVIX_REDIS_DSN: "redis://redis:6379/1"
      SVIX_CACHE_TYPE: "redis"
    ports:
      - "${SVIX_PORT:-8071}:8071"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "svix-server", "healthcheck", "http://localhost:8071"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure

  # Object storage (S3-compatible): Apple Health XML uploads, raw payloads, FIT files.
  # The app talks to whichever endpoint AWS_ENDPOINT_URL points at, and this is set in
  # backend/config/.env (NOT here), so compose never clobbers your credentials.
  # Local-dev defaults (see docker/seaweedfs/s3_config.json and .env.example):
  #   AWS_ENDPOINT_URL=http://seaweedfs:8333
  #   AWS_BUCKET_NAME=open-wearables
  #   AWS_ACCESS_KEY_ID=open-wearables
  #   AWS_SECRET_ACCESS_KEY=open-wearables-secret
  #
  # Encryption at rest (configured in backend/config/.env.example):
  #   DATA_ENCRYPTION_KEY — app-level Fernet for raw/FIT payloads; backend-agnostic.
  #   AWS_SSE_ALGORITHM   — storage-side SSE for the browser-direct XML; the backend
  #                         must support it (SeaweedFS/MinIO notes below).
  #
  # Browser note: presigned upload URLs embed the endpoint host. Set
  # AWS_PUBLIC_ENDPOINT_URL=http://localhost:8333 so the browser uses the mapped port
  # while backend-side requests continue to use http://seaweedfs:8333.

  seaweedfs:
    container_name: seaweedfs__open-wearables
    image: chrislusf/seaweedfs:4.42
    # All-in-one (master + volume + filer + S3 gateway). Identities in s3_config.json
    # make the dev access key/secret authenticate the same way AWS S3 would.
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3_config.json -master.volumeSizeLimitMB=1024"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"    # S3 API (used by the app and the browser)
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888" # Filer UI (optional, for debugging)
    environment:
      # Required because the app defaults to SSE-S3 (AES256). Keep this value stable:
      # changing it makes existing SSE-encrypted objects unreadable! Override this
      # development default with SEAWEEDFS_SSE_KEY when retaining local health data.
      WEED_S3_SSE_KEY: "${SEAWEEDFS_SSE_KEY:-open-wearables-local-development-sse-key}"
      # Protect any filer-persisted KEK used by SeaweedFS migration/fallback paths.
      WEED_S3_SSE_KEK_PASSPHRASE: "${SEAWEEDFS_SSE_KEK_PASSPHRASE:-open-wearables-local-development-kek-passphrase}"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    restart: on-failure

  # Creates the bucket once SeaweedFS is up, then exits. Idempotent (safe to re-run).
  seaweedfs-init:
    container_name: seaweedfs-init__open-wearables
    image: amazon/aws-cli:2.36.25
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: open-wearables
      AWS_SECRET_ACCESS_KEY: open-wearables-secret
      AWS_DEFAULT_REGION: eu-north-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket open-wearables 2>/dev/null \
             || aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket open-wearables 2>/dev/null; then
            echo "SeaweedFS bucket 'open-wearables' ready"; exit 0
          fi
          echo "waiting for SeaweedFS S3 ($$i/30)..."; sleep 2
        done
        echo "SeaweedFS S3 did not become ready in time" >&2; exit 1
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend__open-wearables
    image: open-wearables-frontend:dev
    pull_policy: never
    env_file:
      # .env.example supplies the defaults; .env overrides it when present.
      - ./frontend/.env.example
      - path: ./frontend/.env
        required: false
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/vite.config.ts
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
